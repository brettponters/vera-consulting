<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERA — LinkedIn Cover (Cream)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1584px; height: 396px; overflow: hidden; }
    body {
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
      background: #F4EDE1;
      color: #050507;
      position: relative;
    }

    .watermark { position: absolute; top: -90px; right: -80px; width: 540px; height: 660px; pointer-events: none; z-index: 0; }
    .safe-divider { position: absolute; top: 0; left: 360px; width: 1px; height: 100%; background: rgba(5, 5, 7, 0.06); }

    .content { position: absolute; top: 50%; left: 460px; transform: translateY(-50%); z-index: 2; }

    .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
    .brand svg { height: 56px; width: auto; }
    .brand-word { font-weight: 700; font-size: 64px; letter-spacing: 0.04em; color: #050507; line-height: 1; }
    .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: #C97B3F; margin-left: 6px; margin-top: 18px; }

    .tagline { font-weight: 500; font-size: 26px; color: #4A4A52; line-height: 1.3; letter-spacing: -0.01em; }
    .tagline-accent { color: #C97B3F; font-weight: 600; }

    .url { position: absolute; bottom: 36px; right: 56px; font-weight: 600; font-size: 18px; color: #C97B3F; letter-spacing: 0.02em; z-index: 2; }
    .eyebrow { position: absolute; top: 36px; right: 56px; font-weight: 600; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8B8B92; z-index: 2; }
  </style>
</head>
<body>
  <svg class="watermark" viewBox="0 0 400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 100 0 L 200 380 L 300 0" stroke="#C97B3F" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" opacity="0.08" />
  </svg>
  <div class="safe-divider"></div>
  <div class="eyebrow">AI Consulting · Public Benefit Corporation</div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 0 L 180 540 L 360 0" stroke="#C97B3F" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-word">VERA</span>
      <span class="brand-dot"></span>
    </div>
    <div class="tagline">
      AI <span class="tagline-accent">Strategy</span>,
      <span class="tagline-accent">Integration</span> &amp;
      <span class="tagline-accent">Coaching</span>.
    </div>
  </div>
  <div class="url">veraconsulting.co</div>
</body>
</html>
