<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERA, Facebook Profile Icon (Navy)</title>
  <style>
    /*
      Facebook profile picture (navy).
      Canvas: 1080 x 1080 px. Background matches
      facebook-cover-navy.html for seamless overlap.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body {
      background: #0E1B33;
      display: flex; align-items: center; justify-content: center;
    }
    .mark { width: 720px; height: auto; display: block; }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 0 0 L 180 540 L 360 0" stroke="#E89464" stroke-width="86"
          stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
  </svg>
</body>
</html>
