<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERA, IG Profile Icon (C · V + wordmark stack)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /*
      Instagram profile icon, Form C: V monogram over VERA wordmark.
      Canvas 1080x1080. V dominant, VERA in small caps below with a
      terracotta dot accent. Most legible variant at small sizes.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body {
      background: #0E1B33;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
    }
    svg.mark { width: 1080px; height: 1080px; display: block; }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <!-- V, cream, dominant -->
    <path d="M 370 220 L 540 740 L 710 220"
          fill="none" stroke="#F5EFE4" stroke-width="110"
          stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
    <!-- VERA wordmark, small caps below -->
    <text x="540" y="900" text-anchor="middle"
          font-family="Geist, sans-serif" font-weight="700"
          font-size="118" letter-spacing="10"
          fill="#F5EFE4">VERA</text>
    <!-- Terracotta dot accent after wordmark -->
    <circle cx="852" cy="868" r="14" fill="#E89464" />
  </svg>
</body>
</html>
