<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERA, Facebook Cover (Cream)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /*
      Facebook page cover, cream variant.
      Canvas: 1640 x 856 px. Same composition as linkedin-cover-cream.html,
      typography and watermark scaled up for the taller Facebook canvas.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1640px; height: 856px; overflow: hidden; }
    body {
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
      background: #F4EDE1;
      color: #050507;
      position: relative;
    }

    .watermark {
      position: absolute; top: -140px; right: -120px;
      width: 760px; height: 920px;
      pointer-events: none; z-index: 0;
    }

    .content {
      position: absolute; top: 50%; left: 120px;
      transform: translateY(-50%);
      z-index: 2;
    }

    .brand { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }
    .brand svg { height: 80px; width: auto; }
    .brand-word { font-weight: 700; font-size: 92px; letter-spacing: 0.04em; color: #050507; line-height: 1; }
    .brand-dot { width: 14px; height: 14px; border-radius: 50%; background: #C97B3F; margin-left: 8px; margin-top: 26px; }

    .tagline {
      font-weight: 500; font-size: 38px;
      color: #4A4A52; line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .tagline-accent { color: #C97B3F; font-weight: 600; }

    .url {
      position: absolute; bottom: 56px; right: 72px;
      font-weight: 600; font-size: 24px;
      color: #C97B3F;
      letter-spacing: 0.02em;
      z-index: 2;
    }

    .eyebrow {
      position: absolute; top: 56px; right: 72px;
      font-weight: 600; font-size: 14px;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: #8B8B92;
      z-index: 2;
    }
  </style>
</head>
<body>
  <svg class="watermark" viewBox="0 0 400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M 100 0 L 200 380 L 300 0" stroke="#C97B3F" stroke-width="56"
          stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" opacity="0.08" />
  </svg>

  <div class="eyebrow">AI Consulting · Public Benefit Corporation</div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 0 L 180 540 L 360 0" stroke="#C97B3F" stroke-width="72"
              stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
      </svg>
      <span class="brand-word">VERA</span>
      <span class="brand-dot"></span>
    </div>
    <div class="tagline">
      AI <span class="tagline-accent">Strategy</span>,
      <span class="tagline-accent">Integration</span> &amp;
      <span class="tagline-accent">Foundation</span>.
    </div>
  </div>

  <div class="url">veraconsulting.co</div>
</body>
</html>
