<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERA, IG Profile Icon (B · Two-tone V)</title>
  <style>
    /*
      Instagram profile icon, Form B: two-tone V monogram.
      Canvas 1080x1080. Cream left diagonal + terracotta right diagonal,
      meeting at a mitered V point. Strongest at 40px feed size.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body {
      background: #0E1B33;
      display: flex; align-items: center; justify-content: center;
    }
    svg.mark { width: 1080px; height: 1080px; display: block; }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Left diagonal: cream -->
    <path d="M 330 220 L 540 820"
          fill="none" stroke="#F5EFE4" stroke-width="130"
          stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
    <!-- Right diagonal: terracotta -->
    <path d="M 540 820 L 750 220"
          fill="none" stroke="#E89464" stroke-width="130"
          stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
  </svg>
</body>
</html>
