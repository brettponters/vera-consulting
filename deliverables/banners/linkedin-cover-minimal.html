<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VERA — LinkedIn Cover (Minimal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1584px; height: 396px; overflow: hidden; }
    body {
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
      background: #0E1B33;
      color: #F5EFE4;
      position: relative;
    }

    .center {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
    }
    .brand { display: inline-flex; align-items: center; gap: 24px; }
    .brand svg { height: 96px; width: auto; }
    .brand-word {
      font-weight: 700; font-size: 110px;
      letter-spacing: 0.06em; color: #F5EFE4;
      line-height: 1;
    }
    .brand-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #E89464;
      margin-left: 6px; margin-top: 32px;
    }

    .tag {
      margin-top: 24px;
      font-weight: 500; font-size: 16px;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: #8B9BB4;
    }

    .url {
      position: absolute; bottom: 36px; right: 56px;
      font-weight: 600; font-size: 15px;
      color: #E89464;
      letter-spacing: 0.02em;
      z-index: 2;
    }

    /* Decorative corner marks */
    .corner-tl, .corner-tr, .corner-bl, .corner-br {
      position: absolute; width: 28px; height: 28px;
      border-color: rgba(232, 148, 100, 0.4);
      z-index: 2;
    }
    .corner-tl { top: 36px; left: 36px; border-top: 1px solid; border-left: 1px solid; }
    .corner-tr { top: 36px; right: 36px; border-top: 1px solid; border-right: 1px solid; }
    .corner-bl { bottom: 36px; left: 36px; border-bottom: 1px solid; border-left: 1px solid; }
    .corner-br { bottom: 36px; right: 36px; border-bottom: 1px solid; border-right: 1px solid; }
  </style>
</head>
<body>
  <div class="corner-tl"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <div class="center">
    <div class="brand">
      <svg viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0 0 L 180 540 L 360 0" stroke="#E89464" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-word">VERA</span>
      <span class="brand-dot"></span>
    </div>
    <div class="tag">AI Strategy &middot; Integration &middot; Coaching</div>
  </div>

  <div class="url">veraconsulting.co</div>
</body>
</html>
